[package]
name = "ffinterp"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nalgebra = "0.34.1"
num = "0.4.3"
jlrs = { version = "0.22.1", features = ["ccall", "jlrs-derive"] }
rayon = "1.11.0"
cust = { git = "https://github.com/rust-gpu/rust-cuda", rev = "7fa76f3d717038a92c90bf4a482b0b8dd3259344", optional = true }
kernels = { path = "kernels", optional = true }
rand = "0.9.2"

[build-dependencies]
cuda_builder = { git = "https://github.com/rust-gpu/rust-cuda", rev = "7fa76f3d717038a92c90bf4a482b0b8dd3259344", features = ["rustc_codegen_nvvm"], optional = true }

[features]
cuda = [ "dep:cust", "dep:kernels", "dep:cuda_builder" ]

[dev-dependencies]
criterion = "0.7" 
assert_approx_eq = "1.1.0"
# Plotting
egui_plot = "0.34.0"
eframe = "0.33.2"

[[bench]]
name = "interpolation_bench"
harness = false
